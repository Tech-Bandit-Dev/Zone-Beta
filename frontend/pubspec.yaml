name: zone
description: Zone — The Last Minute. Hyperlocal, real-time signal sharing.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_maps_flutter: ^2.6.0
  google_sign_in: ^6.2.1
  http: ^1.2.1
  # Added for upcoming milestones (live realtime + date formatting):
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
